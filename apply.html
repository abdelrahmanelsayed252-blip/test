  var q = new URLSearchParams(location.search).get("lang");
  setLang(q==="ar" ? "ar" : "en");
  document.addEventListener("click", function(e){
    if (e.target.closest("[data-toggle-lang]")) setLang(root.dataset.lang==="ar" ? "en" : "ar");
  });

'</div></section>'+
(d.kind==="client" ?

  '<a class="btn" href="mailto:abdelrahmanelsayed252@gmail.com?subject='+encodeURIComponent(E.mail_subject||E.title)+'">'+t("Email me","راسلوني بالبريد")+'</a>'+
'</div></div>'+
'</main>'+
'<footer><div class="wrap"><span>'+t("Abdelrahman Elsayed","عبدالرحمن السيد")+' · <span dir="ltr">+20 101 981 5508</span></span><a href="https://www.linkedin.com/in/abdelrahman-elsayed-8a51b51ba" target="_blank">LinkedIn ↗</a></div></footer>';
    var app = document.getElementById("app");
    app.className = ""; app.innerHTML = html;
    if (location.hash) { var el = document.querySelector(location.hash); if (el) el.scrollIntoView(); }
  }
})();
</script>
